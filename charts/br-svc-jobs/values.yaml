image:
  repository: ghcr.io/botresources/br-svc-jobs
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1
strategy: {}

port: 8006

postgres:
  existingSecret: "br-svc-jobs-postgres"
  keys:
    databaseUrl: "DATABASE_URL"
    databaseUrlOwner: "DATABASE_URL_OWNER"
    appPassword: "JOBS_APP_PASSWORD"
  trustedNetworkHosts: []

nats:
  url: "nats://nats:4222"
  existingSecret: ""
  keys:
    user: "NATS_USER"
    password: "NATS_PASSWORD"

runnerTypes:
  retirementQuietPeriodSeconds: 86400
  impactSweepIntervalSeconds: 60
  catalogReconcileIntervalSeconds: 30

priorities:
  defaultMaxPriority: 3

claims:
  maxWaitSeconds: 30
  reservationSeconds: 60
  maxHeld: 1024

savedState:
  maxBytes: 1048576

retention:
  days: 30
  cancelledDays: 0

extraEnv: []

logLevel: "info"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /livez
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 2
    failureThreshold: 3

service:
  type: ClusterIP
  annotations: {}
  labels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
