# cargo-deny config, bootstrapped by runkit.
#
# Run locally: cargo deny --all-features check
# Enforced in CI by .github/workflows/ci.yml job `supply-chain`.
#
# Two entries below are not boilerplate and will bite if they are treated as
# such: the licence allow-list has to name this repository's own licence (it is
# written from the LICENSE file, the same source the workspace manifest reads),
# and `allow-git` has to name every git source the manifest pins. Both fail
# closed — a new git dependency or an unlisted licence turns the job red, and
# that failure is the feature: each is a deliberate call, not a drive-by.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = false

[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
# Resolve advisories by bumping, not by ignoring them. An entry added here MUST
# say which crate pulls the vulnerable code in, why that path is unreachable in
# this service's threat model, the upstream status with the date it was checked,
# and what retires the ignore.
ignore = [
    # RUSTSEC-2023-0071 — rsa (Marvin Attack: timing sidechannel in RSA key
    # operations).
    #
    # Why: rsa is pulled transitively by sqlx-macros-core → sqlx-mysql, which
    # sqlx's macro layer compiles for every backend it might generate code for.
    # At runtime this workspace uses only sqlx-postgres (the workspace pin's
    # features: runtime-tokio, tls-rustls, postgres — no mysql), so the rsa
    # code path never executes; it lives in the proc-macro binary at compile
    # time and is dropped from release artefacts. The backend monorepo carries
    # the identical ignore for the identical reason.
    #
    # Upstream status: no fixed rsa version available; eliminating the
    # transitive dep needs a sqlx major refactor. Retire this ignore when sqlx
    # stops compiling the mysql backend into its macros, or rsa ships a fix.
    #
    # Mirrored in .github/workflows/ci.yml (`cargo audit --ignore ...`).
    { id = "RUSTSEC-2023-0071" },
]

[licenses]
version = 2
# Allow-list rather than deny-list: a licence nobody has considered should stop
# CI, not slip in unnoticed. The last four entries are not speculative: the
# pinned br-rust-common / br-e2e-harness stack pulls each of them in today, and
# the backend monorepo's own deny.toml carries the same four for the same tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Required by the `ring` clarify below — its LICENSE bundles MIT + ISC +
    # OpenSSL boilerplate, and rustls drags it in everywhere.
    "OpenSSL",
    # webpki-roots ships the bundled Mozilla trust store under CDLA.
    "CDLA-Permissive-2.0",
    # MPL-2.0 — weak, file-level copyleft, pulled in via async-graphql →
    # fast_chemail / ascii_utils; consumed unmodified.
    "MPL-2.0",
    # This repository's own licence, as declared in [workspace.package].
    "Apache-2.0",
]
confidence-threshold = 0.93
exceptions = []

# ring's LICENSE is a concatenation cargo-deny cannot score above the
# confidence threshold on its own; the expression states what the file is.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates in this workspace depend on each other by path, which cargo-deny
# reads as a wildcard. They are not a supply-chain risk — they resolve to a
# sibling directory in this same manifest — so path wildcards are allowed while
# `wildcards = "deny"` keeps holding for everything external.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # rustls everywhere. Pulling OpenSSL in drags a C toolchain into an image
    # that has no reason to carry one.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every git source the workspace manifest pins, and only those. HTTPS, matching
# the manifest: two URL schemes for one repository are two cargo sources, and
# cargo unifies neither.
allow-git = [
    "https://github.com/BotResources/br-rust-common",
    "https://github.com/BotResources/br-e2e-harness",
]
