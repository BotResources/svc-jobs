name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt (auto-fix)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all
        run: cargo fmt --all

      - name: check + auto-fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "::error::Code is not formatted. Run 'cargo fmt --all' locally."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: cargo fmt (auto-fix)"
          git push
          echo "::error::Code was auto-formatted and pushed. Please re-run CI."
          exit 1

  check:
    name: cargo clippy + test
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo check contract-jobs (runner footprint, no br-rust-common)
        run: cargo check -p contract-jobs --locked --no-default-features

      - name: cargo check contract-jobs (platform footprint, integration)
        run: cargo check -p contract-jobs --locked --features integration

      - name: cargo test contract-jobs (integration subject grammar)
        run: cargo test -p contract-jobs --locked --features integration

      - name: cargo test (unit)
        run: cargo test --workspace --locked --lib --bins

      - name: helm lint chart
        run: helm lint charts/br-svc-jobs

      - name: helm template dry-run
        run: helm template ci charts/br-svc-jobs --debug > /dev/null

  supply-chain:
    name: supply chain (audit + deny + machete)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: install cargo-audit, cargo-deny, cargo-machete (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete

      - name: cargo audit (RustSec)
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: cargo deny check
        run: cargo deny --all-features check

      - name: cargo machete (unused deps)
        run: cargo machete

  semver:
    name: cargo semver-checks (contract)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: semver-check contract-jobs against its latest release
        run: |
          baseline="$(git tag -l 'contract-jobs/v*' --sort=-v:refname | head -1)"
          if [ -z "$baseline" ]; then
            echo "No contract-jobs release tag yet — nothing to compare against."
            exit 0
          fi
          echo "Baseline: $baseline"
          cargo semver-checks check-release -p contract-jobs --baseline-rev "$baseline"

  changelog:
    name: changelog entry present (per crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-changelog.sh

  registry-gate:
    name: registry gate (bumped versions sealed in the registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gate bumped services against the Services registry
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          source scripts/tracked-services.sh

          read_version() {
              awk '
                  /^\[package\]/      { in_pkg = 1; next }
                  /^\[/ && !/^\[package\]/ { in_pkg = 0 }
                  in_pkg && /^version *=/ {
                      gsub(/[" ]/, "", $3); print $3; exit
                  }'
          }

          git fetch -q origin "${BASE_REF}"

          gated=0
          for svc in ${TRACKED_SERVICES}; do
              cargo="crates/${svc}/Cargo.toml"
              [[ -f "${cargo}" ]] || { echo "::error::missing ${cargo}"; exit 1; }

              version="$(read_version <"${cargo}")"
              base_version="$(git show "origin/${BASE_REF}:${cargo}" 2>/dev/null | read_version || true)"

              if [[ "${version}" == "${base_version}" ]]; then
                  continue
              fi
              if [[ "${version}" == *-dev* || "${version}" == *-rc* || "${version}" == *-pre* ]]; then
                  echo "${svc}: ${version} is non-release — not gated."
                  continue
              fi

              echo "${svc}: ${base_version:-<absent>} -> ${version} — gating against the registry."
              scripts/registry-gate.sh "${svc}" "${version}"
              gated=1
          done

          [[ "${gated}" -eq 1 ]] || echo "No tracked service version bump in this PR — nothing to gate."

      - name: Gate tracked libraries against the Libraries registry
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bash scripts/library-pr-gate.sh

      - name: Library registry wiring tests
        run: bash scripts/test-library-registry.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning

  secrets:
    name: trufflehog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --results=verified,unknown

  changes:
    name: e2e path filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Every service verdict is the MERGE of two independent signals (see the
    # `merge` step): the dorny source-path groups below, and a real per-service
    # Cargo.lock dependency-closure diff. `lock` gates the second, and is the
    # only verdict that exists before a service is registered.
    outputs:
      lock: ${{ steps.filter.outputs.lock }}
      jobs: ${{ steps.merge.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # NB: no `- 'Cargo.lock'` inside a service group — the lockfile is
            # rewritten by any version bump anywhere in the workspace, so a
            # blanket entry fires every suite on an unrelated one. The closure
            # diff below answers the same question per service. `Cargo.toml`
            # stays: the workspace manifest can change features that never
            # surface as a lockfile edit.
            #
            # runkit splices one group per service it scaffolds, ahead of `lock`.

            # jobs — scaffolded by runkit from the HEXAGONAL major 0: the
            # generated crates plus the monorepo PATH deps the skeleton names.
            # A path dep has to be listed here and cannot be left to the
            # lock-closure diff below: editing its source moves no version in
            # Cargo.lock, so the diff is blind to it. Widen this list the day
            # svc-jobs takes a new in-repo dependency.
            jobs:
              - 'crates/contract-jobs/**'
              - 'crates/bc-jobs/**'
              - 'crates/svc-jobs/**'
              - 'crates/infra/**'
              - 'crates/shared-kernel/**'
              - 'Cargo.toml'
              - 'scripts/provision-e2e-infra.sh'
              - '.github/workflows/ci.yml'
            # Any lockfile change at all — gates the closure diff below.
            lock:
              - 'Cargo.lock'
      - name: Lock-closure diff
        id: closure
        if: steps.filter.outputs.lock == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          fail_open() {
            echo "lock-closure: $1 — flagging all groups true (fail-open)" >&2
            {
              # The `:` keeps this block legal while no service has a verdict
              # to flag, and costs one no-op once they do. runkit files each
              # scaffolded service under the line below:
              #   echo "<group>=true"
              echo "jobs=true"
              :
            } >> "$GITHUB_OUTPUT"
          }
          if [ -z "${BASE_SHA:-}" ]; then
            fail_open "no pull_request base sha (non-PR event)"; exit 0
          fi
          # scripts/lock-closure-changed.py walks each group's transitive
          # closure from its root crate and prints `group=true|false`. It is not
          # part of the bootstrapped skeleton: until this repository has it,
          # every group fails open, which runs the suites rather than skipping
          # them — the safe direction of that trade.
          if [ ! -f scripts/lock-closure-changed.py ]; then
            fail_open "scripts/lock-closure-changed.py is not in this repository"; exit 0
          fi
          # checkout@v5 leaves a shallow tree, so fetch just the base commit.
          if ! git fetch --depth=1 origin "$BASE_SHA" 2>/dev/null \
             || ! git show "$BASE_SHA:Cargo.lock" > /tmp/base-Cargo.lock 2>/dev/null; then
            fail_open "could not retrieve base Cargo.lock at $BASE_SHA"; exit 0
          fi
          python3 scripts/lock-closure-changed.py /tmp/base-Cargo.lock Cargo.lock \
            jobs=svc-jobs \
            >> "$GITHUB_OUTPUT"
      # Final verdict per group: dorny source paths OR lock-closure diff. When
      # the lock did not move the closure step is skipped and its outputs are
      # empty (≠ 'true'), so the source paths decide alone. runkit adds the
      # `env:` mapping with the first service's pair — a mapping with no entry
      # is not something to leave in a workflow file.
      - name: Merge path and closure verdicts
        id: merge
        shell: bash
        env:
          P_jobs: ${{ steps.filter.outputs.jobs }}
          C_jobs: ${{ steps.closure.outputs.jobs }}
        run: |
          set -u
          for g in jobs; do
            p="P_$g"; c="C_$g"
            if [ "${!p}" = "true" ] || [ "${!c}" = "true" ]; then
              echo "$g=true" >> "$GITHUB_OUTPUT"
            else
              echo "$g=false" >> "$GITHUB_OUTPUT"
            fi
          done

  e2e-jobs:
    name: e2e jobs (reality chains)
    needs: [fmt, changes]
    if: needs.changes.outputs.jobs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: provision e2e infra (postgres + nats-server)
        run: bash scripts/provision-e2e-infra.sh

      - name: e2e reality chains
        run: >
          cargo test -p svc-jobs --locked --no-fail-fast --tests
          -- --test-threads=1
