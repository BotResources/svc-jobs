apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "br-svc-jobs.fullname" . }}
  labels:
    {{- include "br-svc-jobs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "br-svc-jobs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "br-svc-jobs.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "br-svc-jobs.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "br-svc-jobs.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.postgres.trustedNetworkHosts }}
            # Per-host plaintext opt-out (see values.yaml): the lib refuses a
            # plaintext DSN to a remote host unless its host is listed here.
            - name: TRUSTED_NETWORK_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | quote }}
                  key: {{ .Values.postgres.keys.databaseUrl | quote }}
            - name: DATABASE_URL_OWNER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | quote }}
                  key: {{ .Values.postgres.keys.databaseUrlOwner | quote }}
            {{- if .Values.postgres.keys.appPassword }}
            # When set, svc-jobs provisions the jobs_app role at boot with this
            # password ONLY when the role does not already accept it (a probe
            # guards the PG16-denied ALTER ROLE on re-boot; rotation belongs to
            # the CNPG roles reconciler, not the service), and grants it after
            # migrating. Clear the key when the role is provisioned out of
            # band, so a Secret without it never fails the pod with
            # CreateContainerConfigError.
            - name: JOBS_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | quote }}
                  key: {{ .Values.postgres.keys.appPassword | quote }}
            {{- end }}
            - name: NATS_URL
              value: {{ required "nats.url is required — svc-jobs cannot run without its integration bus and runner transport" .Values.nats.url | quote }}
            {{- if .Values.nats.existingSecret }}
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.existingSecret | quote }}
                  key: {{ .Values.nats.keys.user | quote }}
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.existingSecret | quote }}
                  key: {{ .Values.nats.keys.password | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
