name: CD

on:
  push:
    branches: [main]
    tags:
      - "svc-jobs/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Service version to (re)publish (defaults to Cargo.toml)"
        required: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  detect-bump:
    name: detect-bump
    runs-on: ubuntu-latest
    outputs:
      publish_service: ${{ steps.detect.outputs.publish_service }}
      service_version: ${{ steps.detect.outputs.service_version }}
      tag_contract: ${{ steps.detect.outputs.tag_contract }}
      contract_version: ${{ steps.detect.outputs.contract_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect version bumps
        id: detect
        shell: bash
        run: |
          crate_version() {
            grep -E '^version\s*=' "$1" | head -1 | sed 's/.*"\(.*\)".*/\1/'
          }
          is_release() {
            case "$1" in
              0.0.0|*-dev|*-rc*|*-pre*) return 1 ;;
              *) return 0 ;;
            esac
          }
          tag_exists() {
            git ls-remote --tags origin "refs/tags/$1" | grep -q .
          }

          # The workspace root is virtual — the service version lives on the
          # service crate's own manifest.
          service_version="$(crate_version crates/svc-jobs/Cargo.toml)"
          publish_service=false
          case "${GITHUB_REF}" in
            refs/tags/svc-jobs/v*)
              service_version="${GITHUB_REF#refs/tags/svc-jobs/v}"
              publish_service=true
              echo "Tag trigger — republishing svc-jobs ${service_version}"
              ;;
            *)
              if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                input_version="${{ inputs.version }}"
                [ -n "$input_version" ] && service_version="$input_version"
                publish_service=true
                echo "Manual dispatch — publishing svc-jobs ${service_version}"
              elif is_release "$service_version" \
                && ! tag_exists "svc-jobs/v${service_version}" \
                && ! tag_exists "v${service_version}"; then
                if grep -qE "^## ${service_version}( |$)" CHANGELOG.md; then
                  publish_service=true
                else
                  echo "::warning::svc-jobs ${service_version} has no CHANGELOG heading — not publishing"
                fi
              else
                echo "svc-jobs ${service_version}: already released or not a release version"
              fi
              ;;
          esac

          # contract-jobs — tag-only release, main pushes only. The crate has
          # no artifact: its release IS the tag (consumers pull it as a git
          # dependency), created when its version bumps with a matching plain
          # `## x.y.z` CHANGELOG heading.
          contract_version="$(crate_version crates/contract-jobs/Cargo.toml)"
          tag_contract=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ] \
            && is_release "$contract_version" \
            && ! tag_exists "contract-jobs/v${contract_version}"; then
            if grep -qE "^## ${contract_version}( |$)" crates/contract-jobs/CHANGELOG.md; then
              tag_contract=true
            else
              echo "::warning::contract-jobs ${contract_version} has no CHANGELOG heading — not tagging"
            fi
          else
            echo "contract-jobs ${contract_version}: already tagged or not applicable"
          fi

          {
            echo "publish_service=${publish_service}"
            echo "service_version=${service_version}"
            echo "tag_contract=${tag_contract}"
            echo "contract_version=${contract_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Registry gate (pre-build)
        if: steps.detect.outputs.publish_service == 'true'
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-gate.sh
          svc-jobs
          "${{ steps.detect.outputs.service_version }}"
          ghcr.io/botresources/br-svc-jobs

  publish:
    name: Publish image + chart
    needs: detect-bump
    if: needs.detect-bump.outputs.publish_service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # Zig (cargo-zigbuild's linker) is copied out of the org runner image rather
      # than fetched by mlugg/setup-zig, whose community-mirror download has no
      # timeout and once held a publish job for 2h (BotResources/infra.botresources.ai#241).
      # The job itself stays on the bare VM (not `container:`): registry-docs.sh reaches
      # its ephemeral Postgres on the VM's 127.0.0.1, which a job container can't see.
      - name: zig (from br-arc-runner)
        run: |
          set -euo pipefail
          docker run --rm -v "${RUNNER_TEMP}:/out" ghcr.io/botresources/br-arc-runner:stable \
            sh -c 'cp -a "$(dirname "$(readlink -f "$(command -v zig)")")" /out/zig'
          echo "${RUNNER_TEMP}/zig" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/zig/zig" version

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (Docker)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Registry gate (pre-publish re-check)
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-gate.sh
          svc-jobs
          "${{ needs.detect-bump.outputs.service_version }}"
          ghcr.io/botresources/br-svc-jobs

      - name: Install sqlx-cli (pinned to Cargo.lock's sqlx)
        run: >
          cargo install sqlx-cli
          --version 0.8.6
          --locked
          --no-default-features
          --features rustls,postgres

      - name: Build amd64 binary (SDL source, reused by publish.sh)
        run: cargo zigbuild --release --locked -p svc-jobs --target x86_64-unknown-linux-musl

      - name: Registry docs (pose SDL + DB schema before the push)
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-docs.sh
          svc-jobs
          "${{ needs.detect-bump.outputs.service_version }}"
          --pg docker
          --binary target/x86_64-unknown-linux-musl/release/svc-jobs

      - name: Publish image + chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: ./scripts/publish.sh --skip-checks

  registry-implement:
    name: Registry implement svc-jobs
    needs: [detect-bump, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.detect-bump.outputs.publish_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Record image + observe implemented flip
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-implement.sh
          svc-jobs
          "${{ needs.detect-bump.outputs.service_version }}"
          ghcr.io/botresources/br-svc-jobs:${{ needs.detect-bump.outputs.service_version }}

  tag-service:
    name: Tag + Release svc-jobs
    needs: [detect-bump, publish]
    if: needs.detect-bump.outputs.publish_service == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag + GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-bump.outputs.service_version }}
        run: |
          tag="svc-jobs/v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "$tag" \
            --notes "See the \`## ${VERSION}\` section of CHANGELOG.md."

  tag-contract:
    name: Tag + Release contract-jobs
    needs: detect-bump
    if: needs.detect-bump.outputs.tag_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag + GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-bump.outputs.contract_version }}
        run: |
          tag="contract-jobs/v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "$tag" \
            --notes "See the \`## ${VERSION}\` section of crates/contract-jobs/CHANGELOG.md."
