[package]
name = "svc-jobs"
# 0.0.0-dev until the first release. `scripts/check-changelog.sh` maps exactly
# this placeholder to the `## [Unreleased]` heading in CHANGELOG.md; any other
# version here must have a matching numbered heading or CI fails the PR.
version = "0.0.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "jobs service — the binary: composition root, GraphQL edge, adapters, projectors."

# Only what the skeleton actually references. `cargo-machete` fails CI on a
# dependency nothing uses, so the crate a projector or a publisher needs is
# added by whoever writes it, in the same commit.
[dependencies]
bc-jobs.workspace = true
contract-jobs.workspace = true
br-core-events.workspace = true
br-core-integration.workspace = true
br-util-graphql = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-graphql", tag = "v1.2.0", version = "1.2.0", features = ["graphql"] }
async-nats.workspace = true
async-stream.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
br-core-auth.workspace = true
br-util-postgres.workspace = true
br-util-axum-readiness.workspace = true
br-util-observability.workspace = true
async-graphql.workspace = true
axum.workspace = true
dotenvy.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
br-util-nats-fabric = { workspace = true, features = ["outbox"] }

[dev-dependencies]
# The e2e suite: it spawns the real binary by `CARGO_BIN_EXE_svc-jobs`, provisions
# its database and its NATS through the shared harness, plays the producer over
# the fabric and a runner instance over the runner transport, and drives the
# admin edge over HTTP + SSE.
br-test-harness = { workspace = true, features = ["graphql", "sse", "nats", "nats-fabric"] }
# Inherits the workspace reqwest (rustls + json).
reqwest.workspace = true
tokio.workspace = true
async-graphql.workspace = true
br-core-auth.workspace = true
br-core-integration.workspace = true
chrono.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
